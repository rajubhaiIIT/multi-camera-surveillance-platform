[pytest]
# infra tests need `docker compose up`; model tests need ultralytics + weights (downloads yolo11n.pt).
# Run them with:  pytest -m infra   |   pytest -m model
addopts = -m "not infra and not model"
markers =
    infra: needs the docker-compose services running
    model: needs ultralytics/torch installed (downloads weights on first run)
